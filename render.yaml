services:
  # PROOFPATH AI Backend (FastAPI + AI Intelligence Engine)
  - type: web
    name: proofpath-backend
    env: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: standard
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://proofpath-ai.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: DATABASE_URL
        value: sqlite:////var/data/proofpath.db
    disk:
      name: proofpath-data
      mountPath: /var/data
      sizeGB: 10
